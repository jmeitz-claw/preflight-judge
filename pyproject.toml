[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight-judge"
version = "0.1.0"
description = "An adversarial pre-flight judge panel that refutes weak candidate experiments before you spend compute running them."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["experiments", "ab-testing", "llm", "agents", "evaluation", "bootstrap", "screening", "compute", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []   # stdlib-only by design

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
preflight = "preflight.cli:main"

[project.urls]
Homepage = "https://github.com/jmeitz-claw/preflight-judge"

[tool.setuptools.packages.find]
where = ["."]
include = ["preflight*"]
